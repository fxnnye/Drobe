<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>JAWNZ Verwaltung</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<style>
  :root { --bg: #f6f6f6; --surface: #fff; --text: #111; --muted: #767676; --line: #e2e2e2; --red: #e60023; --red-soft: #fdecee; --amber: #b45309; --amber-soft: #fef3c7; --gray: #efefef; --ok: #1a7f37; --backdrop: rgba(0,0,0,.45); }
  :root:not([data-theme="light"]) { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121212; --surface: #1e1e1e; --text: #f1f1f1; --muted: #a3a3a3; --line: #333; --gray: #2a2a2a; --red-soft: #3a1a1f; --amber: #fbbf24; --amber-soft: #3a2e0f; --ok: #3fb950; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
  header { display: flex; align-items: center; gap: 12px; margin: 8px 0 16px; flex-wrap: wrap; }
  header h1 { font-size: 20px; margin: 0; flex: 1; min-width: 0; }
  .badge { font-size: 12px; background: var(--red); color: #fff; border-radius: 99px; padding: 2px 8px; vertical-align: middle; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  button, .btn { font: inherit; border: 0; border-radius: 12px; padding: 10px 16px; min-height: 42px; background: var(--gray); color: var(--text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; touch-action: manipulation; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--text); color: var(--bg); }
  button.danger { background: transparent; color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); }
  button.danger.solid { background: var(--red); color: #fff; box-shadow: none; }
  @media (hover: hover) { button:hover:not(:disabled), .btn:hover { filter: brightness(.93); } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card.login { max-width: 380px; margin: 12vh auto 0; }
  label { display: block; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
  input, textarea { display: block; width: 100%; margin-top: 4px; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  textarea { resize: vertical; min-height: 96px; }
  .sect { margin-bottom: 28px; } .sect h3 { margin: 0 0 4px; font-size: 16px; }
  select { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line, #ccc); background: var(--card, transparent); color: inherit; }
  .shell { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 28px; align-items: start; }
  .content { min-width: 0; }
  .tabs { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; display: grid; gap: 18px; }
  .tabgroup { display: grid; gap: 2px; }
  .tablabel { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 0 12px 4px; }
  .tabs button { justify-content: flex-start; width: 100%; min-height: 38px; padding: 7px 12px; font-size: 14px; background: transparent; border-radius: 10px; }
  .tabs button .badge { margin-left: auto; }
  .tabs button[aria-selected="true"] { background: var(--text); color: var(--bg); font-weight: 600; }
  @media (hover: hover) { .tabs button:hover:not([aria-selected="true"]) { background: var(--gray); filter: none; } }
  #menuBtn { display: none; }
  .pagehead { margin-bottom: 18px; }
  .pagehead h2 { margin: 0; font-size: 24px; }
  .pagehead p { margin: 2px 0 0; font-size: 14px; }
  @media (max-width: 760px) {
    .shell { display: block; }
    #menuBtn { display: flex; width: 100%; justify-content: flex-start; gap: 10px; position: sticky; top: 8px; z-index: 5; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.08); margin-bottom: 16px; }
    #menuBtn .small { margin-left: auto; }
    #menuBtn .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
    .tabs { display: none; position: static; max-height: none; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin: -8px 0 16px; gap: 12px; }
    .tabs.open { display: grid; }
    .tabs button { min-height: 44px; font-size: 15px; }
    .pagehead h2 { display: none; }
    header { gap: 8px; margin-bottom: 12px; }
    header h1 { flex: 1 0 100%; }
    #who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    header button, header .btn { min-height: 36px; padding: 6px 12px; font-size: 13px; }
    .seg button { flex: 1 1 40%; }
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--gray); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
  .seg button { flex: 1 0 auto; min-height: 36px; padding: 6px 12px; font-size: 14px; background: transparent; border-radius: 9px; white-space: nowrap; }
  .seg button[aria-selected="true"] { background: var(--surface); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .seg .n { font-size: 12px; color: var(--muted); }
  .seg-body > .sect { margin-bottom: 0; } .seg-body > .sect > h3 { display: none; } .seg-body > .sect > p.muted:first-of-type { margin: 0 0 12px; }
  .todo { display: grid; gap: 8px; margin-bottom: 8px; }
  .todo button { justify-content: flex-start; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--red); padding: 14px 16px; text-align: left; }
  .todo button b { font-size: 22px; color: var(--red); min-width: 28px; }
  .todo button span:last-child { margin-left: auto; color: var(--muted); font-size: 13px; }
  .allgood { border-left: 4px solid var(--ok); }
  details.more { margin-top: 12px; border-top: 1px solid var(--line); }
  details.more > summary { margin: 0; padding: 12px 0 0; font-size: 14px; font-weight: 600; }
  details.more > .actions { border-top: 0; }
  .decide { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .stat b { display: block; font-size: 24px; }
  button.stat { display: block; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 0; }
  button.stat.hot b { color: var(--red); }
  button.stat span { display: block; }
  button.stat .go { font-size: 12px; margin-top: 4px; color: var(--muted); }
  @media (hover: hover) { button.stat:hover { border-color: var(--text); filter: none; } }
  .ov h3 { margin: 22px 0 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .ov h3:first-child { margin-top: 0; }
  button.user { background: none; padding: 0; min-height: 0; border-radius: 4px; font: inherit; font-weight: 700; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; display: inline; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar .spacer { flex: 1; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: var(--bg); border-radius: 8px; padding: 8px; margin: 8px 0 0; }
  summary { cursor: pointer; margin-top: 8px; }
  .err { color: var(--red); min-height: 1.4em; }
  [hidden] { display: none !important; }
  p { margin: 6px 0 0; overflow-wrap: anywhere; }

  .tag { font-size: 12px; border-radius: 99px; padding: 2px 8px; background: var(--gray); margin-left: 6px; font-weight: 500; white-space: nowrap; }
  .tag.ban { background: var(--red); color: #fff; }
  .tag.warn { background: var(--amber-soft); color: var(--amber); }
  details.member > summary { list-style: none; cursor: pointer; }
  details.member > summary::-webkit-details-marker { display: none; }
  details.member > summary::before { content: '▸'; color: var(--muted); }
  details.member[open] > summary::before { content: '▾'; }
  details.member > summary .sumline { margin-left: auto; overflow-wrap: anywhere; }
  details.member summary { margin-top: 0; }
  .search { display: flex; gap: 8px; margin-bottom: 12px; }
  .search input { margin: 0; }

  /* Meldungs- und Mitgliedskarten */
  .rep-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rep-head .who { font-size: 18px; font-weight: 700; }
  .reason { font-size: 12px; font-weight: 600; border-radius: 8px; padding: 3px 8px; background: var(--red-soft); color: var(--red); }
  .note { background: var(--bg); border-left: 3px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-top: 12px; white-space: pre-wrap; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 16px; margin-top: 12px; }
  .facts div { font-size: 13px; }
  .facts span { display: block; color: var(--muted); font-size: 12px; }
  .facts .hot { color: var(--red); font-weight: 700; }
  button.link { background: none; padding: 0; min-height: 0; border-radius: 4px; font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; display: inline; }
  button.link.hot { color: var(--red); }
  button.linktag { min-height: 0; border: 0; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; text-decoration: underline; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 12px; display: flex; gap: 12px; align-items: center; }
  .box .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .box button { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  .actions { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 12px; }
  .group h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .group .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .group.sep { border-top: 1px dashed var(--line); padding-top: 12px; }
  .content-list { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  .content-row { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .content-row:last-child { border-bottom: 0; }
  .content-row button { min-height: 36px; padding: 6px 12px; font-size: 13px; }
  .content-row span { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  /* Dialog */
  dialog { border: 0; border-radius: 20px; padding: 0; width: min(520px, calc(100vw - 32px)); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: var(--backdrop); }
  .dlg-in { padding: 20px; }
  .dlg-in h2 { margin: 0 0 8px; font-size: 18px; }
  .dlg-in ul { margin: 8px 0 0; padding-left: 20px; }
  .dlg-in li { margin: 4px 0; }
  .dlg-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
  .dlg-btns button { flex: 1 1 140px; }
  .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--text); margin: 12px 0 0; }
  .check input { width: auto; margin: 3px 0 0; }
  .thread { max-height: 260px; overflow-y: auto; display: grid; gap: 6px; margin: 12px 0; padding: 8px; background: var(--bg); border-radius: 12px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; background: var(--gray); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me { justify-self: end; background: var(--text); color: var(--bg); }
  .msg small { display: block; opacity: .65; font-size: 11px; margin-top: 2px; }
  .counter { text-align: right; font-size: 12px; color: var(--muted); margin-top: 2px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px; max-width: calc(100vw - 32px); z-index: 10; }
  #toast.bad { background: var(--red); color: #fff; }
  @media (max-width: 520px) { .box { flex-wrap: wrap; } .group .row button, .group .row .btn { flex: 1 1 auto; } }
</style>
</head>
<body>
<main>
  <!-- Anmeldung -->
  <section id="loginView" class="card login" hidden>
    <h1 style="font-size:20px;margin:0 0 4px">JAWNZ Verwaltung</h1>
    <p class="muted small" style="margin:0 0 16px">Eigene Anmeldung für Admins und Helfer, getrennt von der App.</p>
    <form id="loginForm">
      <label>E-Mail <input id="email" type="email" autocomplete="username" required></label>
      <label>Passwort <input id="pass" type="password" autocomplete="current-password" required></label>
      <button class="primary" id="loginBtn" type="submit" style="width:100%">Anmelden</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>
  </section>

  <!-- Verwaltung -->
  <section id="adminView" hidden>
    <header>
      <h1>JAWNZ Verwaltung</h1>
      <span class="muted small" id="who"></span>
      <a class="btn" href="./">Zur App</a>
      <button id="logout" type="button">Abmelden</button>
    </header>
    <div class="shell">
    <button type="button" id="menuBtn" aria-expanded="false" aria-controls="nav"><span aria-hidden="true">☰</span><b id="menuLabel">Übersicht</b><span class="dot" id="menuDot" hidden></span><span class="muted small">Menü</span></button>
    <nav class="tabs" id="nav" role="tablist">
      <div class="tabgroup" data-admin><button role="tab" data-tab="overview" aria-selected="true">Übersicht</button></div>
      <div class="tabgroup" data-admin><span class="tablabel">Prüfen</span>
        <button role="tab" data-tab="reports" aria-selected="false">Meldungen <span class="badge" id="repBadge" hidden></span></button>
        <button role="tab" data-tab="legit" aria-selected="false">Legit-Check <span class="badge" id="legitBadge" hidden></span></button>
        <button role="tab" data-tab="moderation" aria-selected="false">Moderation</button></div>
      <div class="tabgroup" data-admin><span class="tablabel">Handel</span>
        <button role="tab" data-tab="sales" aria-selected="false">Verkäufe <span class="badge" id="salesBadge" hidden></span></button>
        <button role="tab" data-tab="reviews" aria-selected="false">Bewertungen</button></div>
      <div class="tabgroup" data-admin><span class="tablabel">Community</span>
        <button role="tab" data-tab="members" aria-selected="false">Mitglieder</button>
        <button role="tab" data-tab="roles" aria-selected="false">Rollen</button></div>
      <div class="tabgroup"><span class="tablabel">Kuratieren</span>
        <button role="tab" data-tab="picks" aria-selected="false">Staff Picks</button></div>
      <div class="tabgroup" data-admin><span class="tablabel">System</span>
        <button role="tab" data-tab="errors" aria-selected="false">Fehlerprotokoll</button>
        <button role="tab" data-tab="log" aria-selected="false">Protokoll</button></div>
    </nav>
    <div class="content">
    <div class="pagehead"><h2 id="pageTitle">Übersicht</h2><p class="muted" id="pageHint"></p></div>
    <div id="overview"></div>
    <div id="reports" hidden></div>
    <div id="legit" hidden></div>
    <div id="sales" hidden></div>
    <div id="reviews" hidden></div>
    <div id="members" hidden></div>
    <div id="moderation" hidden></div>
    <div id="roles" hidden></div>
    <div id="errors" hidden></div>
    <div id="log" hidden></div>
    <div id="picks" hidden></div>
    </div>
    </div>
  </section>
</main>

<dialog id="dlg"><div class="dlg-in"><h2 id="dlgTitle"></h2><div id="dlgBody"></div><div class="dlg-btns" id="dlgBtns"></div></div></dialog>
<div id="toast" role="status" hidden></div>

<script src="vendor/supabase.js"></script>
<script>
(() => {
  const SUPABASE_URL = 'https://elffmxtoxvygziiztjhd.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_3goVqjFm8wKraIugwDH5pw_QZGH23tM'; // öffentlicher Schlüssel; der Schutz liegt in is_admin() der Datenbank
  const REASONS = { betrug: 'Betrugsverdacht', faelschung: 'Fälschung', belaestigung: 'Belästigung', spam: 'Spam', sonstiges: 'Sonstiges' };
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const btn = (label, cls, onclick) => { const b = el('button', cls, label); b.type = 'button'; if (onclick) b.onclick = onclick; return b; };
  const fmt = (d) => new Date(d).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' });
  const day = (d) => new Date(d).toLocaleDateString('de-DE');

  const show = (view) => { $('loginView').hidden = view !== 'login'; $('adminView').hidden = view !== 'admin'; };
  if (!window.supabase) { show('login'); $('loginBtn').disabled = true; $('loginErr').textContent = 'Die Bibliothek konnte nicht geladen werden. Bitte Seite neu laden.'; return; }
  // Eigener Speicherschlüssel: die Verwaltungs-Sitzung überschreibt nie die Sitzung der App (gleiche Domain)
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'drobe-admin-auth', detectSessionInUrl: false },
  });

  /* ---------- Hilfen: Hinweis und Dialog ---------- */
  let toastTimer = 0;
  function toast(text, bad) {
    const t = $('toast'); t.textContent = text; t.className = bad ? 'bad' : ''; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, bad ? 6000 : 3500);
  }
  const dlg = $('dlg');
  let dlgDone = null;
  dlg.addEventListener('close', () => { if (dlgDone) { const f = dlgDone; dlgDone = null; f(); } });
  function openModal(title, nodes, buttons, onClose) {
    $('dlgTitle').textContent = title;
    $('dlgBody').replaceChildren(...nodes);
    $('dlgBtns').replaceChildren(...buttons);
    dlgDone = onClose || null;
    if (!dlg.open) dlg.showModal();
  }
  const closeModal = () => { if (dlg.open) dlg.close(); };

  // Rückfrage vor jeder Änderung: sagt genau, was passiert; Abbrechen ist die Vorauswahl.
  // Ergebnis: null (abgebrochen) oder { reason, checked }
  function confirmAction(o) {
    return new Promise((resolve) => {
      const body = [];
      if (o.intro) body.push(el('p', null, o.intro));
      if (o.bullets) { const ul = el('ul'); for (const b of o.bullets) ul.append(el('li', null, b)); body.push(ul); }
      let reason = null, typed = null, check = null;
      if (o.reasonLabel) {
        const l = el('label', null, o.reasonLabel); l.style.marginTop = '12px'; reason = el('textarea'); reason.maxLength = 300; reason.style.minHeight = '64px'; l.append(reason); body.push(l);
      }
      if (o.typeName) {
        const l = el('label', null, 'Zur Bestätigung den Benutzernamen „' + o.typeName + '“ eintippen'); typed = el('input'); typed.autocomplete = 'off'; typed.autocapitalize = 'none'; l.append(typed); body.push(l);
      }
      if (o.checkboxLabel) {
        const l = el('label', 'check'); check = el('input'); check.type = 'checkbox'; check.checked = !o.mustCheck; l.append(check, el('span', null, o.checkboxLabel)); body.push(l);
      }
      const cancel = btn('Abbrechen', null, () => closeModal());
      const ok = btn(o.confirmLabel, o.danger ? 'danger solid' : 'primary');
      const gate = () => { ok.disabled = (typed && typed.value.trim().toLowerCase() !== o.typeName.toLowerCase()) || (o.mustCheck && check && !check.checked); };
      if (typed || o.mustCheck) { ok.disabled = true; if (typed) typed.oninput = gate; if (check) check.onchange = gate; }
      let answered = false;
      ok.onclick = () => { answered = true; resolve({ reason: reason ? reason.value.trim() : '', checked: check ? check.checked : false }); closeModal(); };
      openModal(o.title, body, [cancel, ok], () => { if (!answered) resolve(null); });
      cancel.focus();
    });
  }

  async function call(fn, args, okText) {
    const { data, error } = await sb.rpc(fn, args);
    if (error) { console.error(error); toast('Das hat nicht geklappt: ' + error.message, true); checkSession(); return { failed: true }; }
    if (okText) toast(okText);
    return { data };
  }

  /* ---------- Hilfe beim Anmelden: Mails an das Mitglied ---------- */
  // Läuft über die normale Anmelde-Schnittstelle: Supabase verschickt die Mail selbst, du siehst weder Passwort noch Link.
  async function mailFlow(kind, username, email) {
    const reset = kind === 'reset';
    const r = await confirmAction({
      title: reset ? 'Passwort-Mail an ' + username + ' senden?' : 'Bestätigungs-Mail an ' + username + ' erneut senden?',
      intro: (reset ? 'Das Mitglied bekommt eine Mail mit einem Link, um ein neues Passwort zu setzen.' : 'Das Mitglied bekommt die Mail zum Bestätigen der E-Mail-Adresse noch einmal. Hat es sie schon bestätigt, passiert nichts.') + ' Adresse: ' + email,
      confirmLabel: 'Mail senden',
    });
    if (!r) return;
    try {
      const { error } = reset
        ? await sb.auth.resetPasswordForEmail(email)
        : await sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: 'https://jawnz.de/' } });
      if (error) throw error;
      toast('Mail an ' + email + ' wurde gesendet.');
    } catch (e) { console.error(e); toast('Das hat nicht geklappt: ' + ((e && e.message) || 'unbekannter Fehler'), true); }
  }

  /* ---------- Gemeinsame Aktionen ---------- */
  async function banFlow(username, banned, opt = {}) {
    if (banned) {
      const r = await confirmAction({
        title: username + ' entsperren?',
        intro: 'Das Konto kann sich wieder anmelden und seine Teile und Outfits sind wieder sichtbar.',
        confirmLabel: 'Konto entsperren',
      });
      if (!r) return false;
      return !(await call('admin_set_ban', { p_username: username, p_ban: false }, username + ' ist entsperrt.')).failed;
    }
    const r = await confirmAction({
      title: username + ' sperren?',
      intro: 'Das passiert sofort:',
      bullets: [
        'Das Konto wird abgemeldet und kann sich nicht mehr anmelden.',
        'Alle Teile, Outfits und Wünsche verschwinden aus Feed, Suche und Profil.',
        'Alle offenen Meldungen gegen dieses Konto gelten als erledigt.',
        'Es wird nichts gelöscht. Beim Entsperren werden die Inhalte wieder sichtbar.',
      ],

    });

  // Konto endgültig löschen: erst die Fotos (Storage-API), dann das Konto samt allen Einträgen
  async function deleteAccountFlow(username) {
    const r = await confirmAction({
      title: username + ' endgültig löschen?',
      intro: 'Das lässt sich nicht rückgängig machen, auch nicht über Entsperren:',
      bullets: [
        'Das Konto, alle Teile, Outfits, Nachrichten, Angebote und Meldungen werden gelöscht.',
        'Alle Fotos des Kontos werden gelöscht.',
        'Die E-Mail-Adresse wird frei, die Person kann sich neu registrieren.',
        'Wenn du nur den Zugang beenden willst, nimm „Konto sperren“. Das lässt sich zurücknehmen.',
      ],
      reasonLabel: 'Grund (bleibt im Protokoll, optional)',
      typeName: username,
      checkboxLabel: 'Ich weiß, dass das Konto danach unwiederbringlich weg ist.',
      mustCheck: true,
      confirmLabel: 'Konto endgültig löschen',
      danger: true,
    });
    if (!r) return false;
    toast('Lösche …');
    const idRes = await sb.rpc('admin_member_id', { p_username: username });
    if (idRes.error) { toast('Das hat nicht geklappt: ' + idRes.error.message, true); return false; }
    const store = sb.storage.from('images');
    for (let guard = 0; guard < 50; guard++) {
      const { data, error } = await store.list(idRes.data, { limit: 100 });
      if (error) { toast('Die Fotos konnten nicht gelöscht werden, das Konto wurde nicht gelöscht: ' + error.message, true); return false; }
      if (!data || !data.length) break;
      const rm = await store.remove(data.map((f) => idRes.data + '/' + f.name));
      if (rm.error) { toast('Die Fotos konnten nicht gelöscht werden, das Konto wurde nicht gelöscht: ' + rm.error.message, true); return false; }
    }
    return !(await call('admin_delete_account', { p_username: username, p_reason: r.reason }, username + ' wurde gelöscht.')).failed;
  }

  async function removeFlow(username, kind, id, name) {
    const r = await confirmAction({
      title: '„' + (name || 'Inhalt') + '“ entfernen?',
      intro: (kind === 'items' ? 'Das Teil' : 'Das Outfit') + ' von ' + username + ' wird gelöscht, auch auf den Geräten des Mitglieds. Das lässt sich nicht rückgängig machen.',
      reasonLabel: 'Grund (nur für dich im Protokoll sichtbar, optional)',
      confirmLabel: 'Endgültig entfernen',
      danger: true,
    });
    if (!r) return false;
    return !(await call('admin_remove_content', { p_username: username, p_kind: kind, p_id: id, p_reason: r.reason }, 'Inhalt entfernt.')).failed;
  }

  function messageFlow(username) {
    const thread = el('div', 'thread');
    const text = el('textarea'); text.maxLength = 500; text.placeholder = 'Nachricht an ' + username + ' …';
    const counter = el('div', 'counter', '0 / 500');
    const send = btn('Nachricht senden', 'primary'); send.disabled = true;
    const close = btn('Schließen', null, () => closeModal());
    text.oninput = () => { counter.textContent = text.value.length + ' / 500'; send.disabled = !text.value.trim(); };
    const hint = el('p', 'muted small', 'Das Mitglied sieht die Nachricht in der App unter Nachrichten als „JAWNZ“ und kann antworten. Antworten erscheinen hier.');
    async function load() {
      const { data, error } = await sb.rpc('admin_thread', { p_username: username });
      thread.replaceChildren();
      if (error) { thread.append(el('p', 'err', 'Der Verlauf konnte nicht geladen werden. Ist Migration 0020 ausgeführt?')); return; }
      if (!data.length) { thread.append(el('p', 'muted small', 'Noch keine Nachrichten.')); return; }
      for (const m of data) { const b = el('div', 'msg' + (m.from_member ? '' : ' me'), m.body); b.append(el('small', null, (m.from_member ? username : 'Du') + ' · ' + fmt(m.at))); thread.append(b); }
      thread.scrollTop = thread.scrollHeight;
    }
    send.onclick = async () => {
      send.disabled = true;
      const r = await call('admin_send_message', { p_username: username, p_text: text.value }, 'Nachricht gesendet.');
      if (r.failed) { send.disabled = false; return; }
      text.value = ''; counter.textContent = '0 / 500';
      load();
    };
    openModal('Nachricht an ' + username, [thread, text, counter, hint], [close, send]);
    load();
  }

  // Aktionsleiste: nach Zweck gruppiert, Gefährliches getrennt und rot umrandet
  function accountActions(username, state, opt = {}) {
    const wrap = el('div', 'actions');
    const g1 = el('div', 'group'); g1.append(el('h4', null, 'Mitglied'));
    const r1 = el('div', 'row');
    const prof = el('a', 'btn', 'Profil ansehen'); prof.href = './?verwaltung=' + encodeURIComponent(username) + '#/u/' + encodeURIComponent(username);
    prof.onclick = () => rememberPlace(username); // gleiches Fenster; „Zurück zur Verwaltung“ landet wieder an dieser Stelle
    r1.append(prof, btn('Nachricht schreiben', null, () => messageFlow(username)));
    if (opt.onContent) r1.append(btn('Inhalte ansehen', null, opt.onContent));
    g1.append(r1); wrap.append(g1);
    if (opt.email) {
      const g3 = el('div', 'group sep'); g3.append(el('h4', null, 'Anmeldung'));
      const r3 = el('div', 'row');
      r3.append(btn('Passwort-Mail senden', null, () => mailFlow('reset', username, opt.email)), btn('Bestätigungs-Mail erneut senden', null, () => mailFlow('confirm', username, opt.email)));
      g3.append(r3); wrap.append(g3);
    }
    if (!state.isAdmin) {
      const g2 = el('div', 'group sep'); g2.append(el('h4', null, 'Konto'));

      r2.append(btn('Konto löschen …', 'danger', async () => { if (await deleteAccountFlow(username)) opt.refresh(); }));
      g2.append(r2); wrap.append(g2);

  }

  /* ---------- Merken, wo man war, bevor es in die App geht ---------- */
  const PLACE = 'jawnz-admin-place';
  function rememberPlace(user) {
    const tab = document.querySelector('.tabs button[aria-selected="true"]').dataset.tab;
    try { sessionStorage.setItem(PLACE, JSON.stringify({ tab, user, query: memberQuery })); } catch (e) { /* dann startet die Verwaltung vorn */ }
  }
  // Gibt true zurück, wenn der gemerkte Reiter wieder geöffnet wurde (nur Reiter, die diese Rolle sehen darf)
  function restorePlace() {
    let p = null;
    try { p = JSON.parse(sessionStorage.getItem(PLACE)); sessionStorage.removeItem(PLACE); } catch (e) { /* egal */ }
    const b = p && document.querySelector('.tabs button[data-tab="' + p.tab + '"]');
    if (!b || b.hidden) return false;
    if (p.tab === 'members') { openUser = p.user; memberQuery = p.query || ''; $('members').replaceChildren(); }
    goTab(p.tab);
    return true;
  }

  /* ---------- Anmeldung und Tabs ---------- */
  // Abgelaufene Anmeldung (z. B. nach „Abmelden“ in der App): Abfragen liefen sonst ohne Konto und endeten in „permission denied“
  let leaving = false; // true, während man sich selbst abmeldet
  function expired() {
    if (leaving || $('adminView').hidden) return;
    closeModal();
    show('login');
    $('loginErr').textContent = 'Deine Anmeldung ist abgelaufen. Bitte melde dich neu an.';
  }
  async function checkSession() {
    try { const { data, error } = await sb.auth.getSession(); if (!error && !data.session) expired(); } catch (e) { /* offline */ }
  }
  sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') setTimeout(expired, 0); });
  let role = null; // 'admin' sieht alles, 'moderator' (Helfer) nur Meldungen und Legit-Check (lesen) sowie Staff Picks
  const HELPER_TABS = ['reports', 'legit', 'picks'];
  async function enter(user) {
    role = null;
    try {
      const a = await sb.rpc('is_admin');
      if (!a.error && a.data === true) role = 'admin';
      else { const m = await sb.rpc('has_role', { p_role: 'moderator' }); if (!m.error && m.data === true) role = 'moderator'; }
    } catch (e) { /* offline */ }
    if (!role) {
      await sb.auth.signOut();
      show('login');
      $('loginErr').textContent = 'Dieses Konto hat keinen Zugriff auf die Verwaltung.';
      return;
    }
    const helper = role !== 'admin';
    // Helfer sehen nur Meldungen und Legit-Check (lesen) sowie Staff Picks; Gruppen ohne sichtbaren Reiter verschwinden
    document.querySelectorAll('.tabs button').forEach((b) => { b.hidden = helper && !HELPER_TABS.includes(b.dataset.tab); });
    document.querySelectorAll('.tabgroup').forEach((g) => { g.hidden = ![...g.querySelectorAll('button')].some((b) => !b.hidden); });
    $('who').textContent = user.email + (helper ? ' · Helfer' : ' · Admin');
    show('admin');
    const restored = restorePlace();
    if (helper) { if (!restored) goTab('reports'); return; }
    if (!restored) goTab('overview');
    loadReports();
  }
  const loaders = { overview: () => loadOverview(), reports: () => loadReports(), legit: () => loadLegit(), sales: () => loadSales(), reviews: () => loadReviews(), members: () => loadMembers(), moderation: () => loadModeration(), roles: () => loadRoles(), picks: () => loadPicks(), errors: () => loadErrors(), log: () => loadLog() };
  const PAGES = {
    overview: ['Übersicht', 'Was gerade zu tun ist und die wichtigsten Zahlen.'],
    reports: ['Meldungen', 'Offene Meldungen von Mitgliedern.'],
    legit: ['Legit-Check', 'Eingefrorene Teile und auffällige Abstimmungen.'],
    moderation: ['Moderation', 'Gesperrte Konten und versteckte Inhalte.'],
    sales: ['Verkäufe', 'Angebote, Bestellungen und Anzeigen.'],
    reviews: ['Bewertungen', 'Bewertungen ansehen und missbräuchliche entfernen.'],
    members: ['Mitglieder', 'Suchen, aufklappen und handeln.'],
    roles: ['Rollen', 'Wer Admin oder Helfer ist.'],
    picks: ['Staff Picks', 'Teile, die im Feed unter der Flamme stehen.'],
    errors: ['Fehlerprotokoll', 'Fehler, die die App gemeldet hat.'],
    log: ['Protokoll', 'Alle Eingriffe der Verwaltung.'],
  };
  const menu = (open) => { $('nav').classList.toggle('open', open); $('menuBtn').setAttribute('aria-expanded', String(open)); };
  $('menuBtn').onclick = () => menu(!$('nav').classList.contains('open'));
  const menuDot = () => { $('menuDot').hidden = ![...$('nav').querySelectorAll('.badge')].some((b) => !b.hidden); };
  // Mehrere Abschnitte eines Reiters als Umschalter: immer nur einer sichtbar, die Wahl bleibt beim Neuladen erhalten
  const segChoice = {};
  function segmented(box, key, parts) {
    const bar = el('div', 'seg'); bar.setAttribute('role', 'tablist');
    const body = el('div', 'seg-body');
    const pick = (i) => { segChoice[key] = i; [...bar.children].forEach((b, n) => b.setAttribute('aria-selected', String(n === i))); body.replaceChildren(parts[i][1]); };
    parts.forEach(([label, , count], i) => { const b = btn(label, null, () => pick(i)); b.setAttribute('role', 'tab'); if (count != null) b.append(el('span', 'n', String(count))); bar.append(b); });
    box.append(bar, body);
    pick(segChoice[key] < parts.length ? segChoice[key] : 0);
  }
  function goTab(id) {
    document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.tab === id)));
    $('pageTitle').textContent = $('menuLabel').textContent = PAGES[id][0];
    $('pageHint').textContent = PAGES[id][1];
    menu(false);
    for (const k of Object.keys(loaders)) $(k).hidden = k !== id;
    loaders[id]();
    window.scrollTo({ top: 0 });
  }
  document.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => goTab(b.dataset.tab); });
  // Benutzername zum Anklicken: springt zu dieser Person in „Mitglieder“
  let openUser = null;
  function openMember(name) { openUser = name; memberQuery = name; $('members').replaceChildren(); goTab('members'); }
  const userBtn = (name) => { if (!name) return el('span', 'who', '?'); if (role !== 'admin') return el('b', null, name); const b = btn(name, 'user', () => openMember(name)); b.title = 'Mitglied öffnen'; return b; };
  const factUser = (label, name) => { const d = el('div'); d.append(el('span', null, label), userBtn(name)); return d; };
  const loading = (box, text) => box.replaceChildren(el('p', 'muted', text || 'Lade …'));
  const failed = (box, text, retry) => { box.replaceChildren(el('p', 'err', text)); box.append(btn('Nochmal versuchen', null, retry)); checkSession(); };
  function setBadge(n) { $('repBadge').hidden = !n; $('repBadge').textContent = n; menuDot(); }

  /* ---------- Übersicht ---------- */
  async function loadOverview() {
    const box = $('overview');
    loading(box);
    try {
      const { data, error } = await sb.rpc('admin_overview');
      if (error) throw error;
      const groups = [
        ['Community', [['members', 'Mitglieder', 'members'], ['new_members', 'Neu (7 Tage)', 'members'], ['items', 'Teile', 'members'], ['outfits', 'Outfits', 'members']]],
        ['Prüfen', [['open_reports', 'Offene Meldungen', 'reports', true], ['frozen', 'Eingefrorene Teile', 'legit', true]]],
        ['Handel', [['listings_active', 'Teile im Verkauf', 'sales'], ['open_sales', 'Offene Verkäufe', 'sales'], ['stuck_orders', 'Hängende Bestellungen', 'sales', true], ['open_transfers', 'Offene Übergaben', 'sales'], ['reviews_7d', 'Bewertungen (7 Tage)', 'reviews']]],
        ['System', [['errors_24h', 'Fehler (24 h)', 'errors', true]]],
      ];
      const wrap = el('div', 'ov');
      wrap.append(el('h3', null, 'Zu erledigen'));
      const todo = el('div', 'todo');
      for (const [k, label, tab] of groups.flatMap((g) => g[1]).filter((t) => t[3] && data[t[0]] > 0)) {
        const t = btn('', null, () => goTab(tab)); t.append(el('b', null, String(data[k])), el('span', null, label), el('span', null, 'Ansehen →')); todo.append(t);
      }
      if (!todo.children.length) todo.append(el('div', 'card allgood', 'Nichts offen.'));
      wrap.append(todo);
      for (const [title, tiles] of groups) {
        if (title === 'Prüfen') continue; // steht schon oben unter „Zu erledigen“
        wrap.append(el('h3', null, title));
        const grid = el('div', 'stats');
        for (const [k, label, tab, warn] of tiles) {
          const c = btn('', 'stat' + (warn && data[k] > 0 ? ' hot' : ''), () => goTab(tab));
          c.append(el('b', null, String(data[k] ?? 0)), el('span', 'muted small', label));
          grid.append(c);
        }
        wrap.append(grid);
      }
      box.replaceChildren(wrap);
      setBadge(data.open_reports);
      for (const [id, n] of [['legitBadge', data.frozen], ['salesBadge', data.stuck_orders]]) { const b = $(id); if (b) { b.hidden = !n; b.textContent = n || ''; } }
      menuDot();
    } catch (e) { console.error(e); failed(box, 'Die Übersicht fehlt noch. Ist Migration 0018 ausgeführt?', loadOverview); }
  }

  /* ---------- Meldungen ---------- */
  const termsText = (at, ver) => (at ? fmt(at) + (ver ? ' (Fassung ' + ver + ')' : '') : 'nicht erfasst');
  function fact(label, value, hot, onclick) {
    const d = el('div'); d.append(el('span', null, label));
    if (onclick) { const b = btn(value + ' ansehen', 'link' + (hot ? ' hot' : ''), onclick); d.append(b); } else d.append(el('b', hot ? 'hot' : null, value));
    return d;
  }
  // Alle Meldungen gegen ein Konto (offen und erledigt)
  async function reportsFlow(username) {
    const list = el('div', 'thread'); list.style.maxHeight = '420px';
    list.append(el('p', 'muted', 'Lade …'));
    openModal('Meldungen gegen ' + username, [list], [btn('Schließen', null, () => closeModal())]);
    const { data, error } = await sb.rpc('admin_reports_for', { p_username: username });
    list.replaceChildren();
    if (error) { list.append(el('p', 'err', 'Die Meldungen konnten nicht geladen werden. Ist Migration 0021 ausgeführt?')); return; }
    if (!data.length) { list.append(el('p', 'muted', 'Keine Meldungen.')); return; }
    for (const r of data) {
      const c = el('div', 'card'); c.style.margin = '0';
      const h = el('div', 'rep-head');
      h.append(el('span', 'reason', REASONS[r.reason] || r.reason), el('span', 'tag' + (r.resolved_at ? '' : ' warn'), r.resolved_at ? 'erledigt am ' + day(r.resolved_at) : 'offen'));
      c.append(h, el('div', 'muted small', 'Von ' + (r.reporter || '?') + ' am ' + fmt(r.created_at)));
      if (r.content_name) c.append(el('div', 'small', (r.content_kind === 'outfits' ? 'Outfit: ' : 'Teil: ') + r.content_name));
      c.append(r.note ? el('div', 'note', r.note) : el('div', 'muted small', 'Keine Notiz.'));
      list.append(c);
    }
  }
  async function loadReports() {
    const box = $('reports');
    loading(box);
    try {
      const { data, error } = await sb.rpc(role === 'admin' ? 'admin_reports' : 'staff_reports');
      if (error) throw error;
      setBadge(data.length);
      box.replaceChildren();
      if (!data.length) return box.append(el('p', 'muted', 'Keine offenen Meldungen.'));
      for (const r of data) box.append(reportCard(r));
    } catch (e) { console.error(e); failed(box, 'Die Meldungen konnten nicht geladen werden.', loadReports); }
  }
  function reportCard(r) {
    const card = el('div', 'card');
    const head = el('div', 'rep-head');
    head.append(el('span', 'reason', REASONS[r.reason] || r.reason), userBtn(r.target));
    if (r.target_banned) head.append(el('span', 'tag ban', 'gesperrt'));
    if (r.target_is_admin) head.append(el('span', 'tag', 'Admin'));
    if (r.target_reports > 1) { const t = role === 'admin' ? btn(r.target_reports + ' Meldungen', 'tag warn linktag', () => reportsFlow(r.target)) : el('span', 'tag warn', r.target_reports + ' Meldungen'); head.append(t); }
    card.append(head);
    card.append(el('div', 'muted small', 'Gemeldet von ' + (r.reporter || '?') + ' am ' + fmt(r.created_at)));
    card.append(r.note ? el('div', 'note', r.note) : el('div', 'muted small', 'Keine Notiz vom Melder.'));
    if (r.content_name != null || r.record_id) {
      const b = el('div', 'box');
      const t = el('div', 'txt');
      t.append(el('span', 'muted small', 'Gemeldeter Inhalt'), el('div', null, r.content_name ? (r.content_kind === 'outfits' ? 'Outfit: ' : 'Teil: ') + r.content_name : 'Nicht mehr vorhanden'));
      b.append(t);
      if (role === 'admin' && r.content_name && r.content_deleted === false) b.append(btn('Inhalt entfernen', 'danger', async () => { if (await removeFlow(r.target, r.content_kind, r.record_id, r.content_name)) loadReports(); }));
      card.append(b);
    }
    const facts = el('div', 'facts');
    facts.append(
      fact('Dabei seit', r.target_since ? day(r.target_since) : '?'),
      fact('Teile', String(r.target_items)), fact('Outfits', String(r.target_outfits)),
      fact('AGB zugestimmt', termsText(r.target_terms_at, r.target_terms_version)),
      fact('Meldungen gesamt', String(r.target_reports), r.target_reports > 1, role === 'admin' && r.target ? () => reportsFlow(r.target) : null),
    );
    const more = el('details', 'more'); more.append(el('summary', null, role === 'admin' ? 'Mehr zum Konto und Maßnahmen' : 'Mehr zum Konto'), facts);
    const refresh = () => { loadReports(); if (role === 'admin') loadOverview(); };
    if (role !== 'admin') { card.append(more, el('p', 'muted small', 'Als Helfer kannst du Meldungen ansehen. Maßnahmen ergreifen die Admins.')); return card; }
    if (r.target) more.append(accountActions(r.target, { banned: r.target_banned, isAdmin: r.target_is_admin }, { reportId: r.id, refresh }));
    const row = el('div', 'decide');
    if (r.record_id && (r.note || '').startsWith('Community-Prüfung')) row.append(btn('Ist echt, Einfrieren aufheben', 'primary', async () => {
      const ok = await confirmAction({ title: 'Teil als echt bestätigen?', intro: 'Das Teil ist wieder normal sichtbar, Anfragen sind möglich, und die Community kann es nicht mehr automatisch einfrieren lassen.', confirmLabel: 'Ist echt' });
      if (!ok) return;
      if (!(await call('admin_legit_clear', { p_report: r.id }, 'Teil als echt bestätigt.')).failed) refresh();
    }));
    row.append(btn('Als erledigt markieren', null, async () => {
      const a = await confirmAction({ title: 'Meldung als erledigt markieren?', intro: 'Die Meldung verschwindet aus der Liste. Am Konto und an den Inhalten ändert sich nichts.', confirmLabel: 'Als erledigt markieren' });
      if (!a) return;
      if (!(await call('admin_resolve_report', { p_id: r.id }, 'Meldung erledigt.')).failed) refresh();
    }));
    card.append(row, more);
    return card;
  }

  /* ---------- Mitglieder ---------- */
  let memberQuery = '';
  async function loadMembers() {
    const box = $('members');
    if (!box.querySelector('.search')) {
      const form = el('form', 'search');
      const input = el('input'); input.type = 'search'; input.placeholder = 'Benutzername oder E-Mail'; input.maxLength = 80; input.value = memberQuery;
      const go = el('button', 'primary', 'Suchen'); go.type = 'submit';
      form.append(input, go);
      form.onsubmit = (ev) => { ev.preventDefault(); memberQuery = input.value; loadMembers(); };
      box.replaceChildren(form, el('div'));
    }
    const list = box.lastElementChild;
    loading(list);
    try {
      const { data, error } = await sb.rpc('admin_members', { p_query: memberQuery });
      if (error) throw error;
      list.replaceChildren();
      if (!data.length) return list.append(el('p', 'muted', 'Keine Mitglieder gefunden.'));
      for (const m of data) list.append(memberCard(m));
      if (openUser) { const c = [...list.children].find((x) => x.dataset && x.dataset.user === openUser); openUser = null; if (c) { c.open = true; c.scrollIntoView({ block: 'start' }); } }
    } catch (e) { console.error(e); failed(list, 'Die Mitglieder konnten nicht geladen werden. Ist Migration 0019 ausgeführt?', loadMembers); }
  }
  function memberCard(m) {
    const card = el('details', 'card member'); card.dataset.user = m.username;
    const sum = el('summary', 'rep-head');
    sum.append(el('span', 'who', m.username));
    if (m.banned) sum.append(el('span', 'tag ban', 'gesperrt'));
    if (m.is_admin) sum.append(el('span', 'tag', 'Admin'));
    if (m.reports_against > 0) sum.append(el('span', 'tag warn', m.reports_against + (m.reports_against === 1 ? ' Meldung' : ' Meldungen')));
    sum.append(el('span', 'muted small sumline', m.email));

  /* ---------- Vorschaubilder ---------- */
  async function thumbMap(paths) {
    const out = {};
    if (!paths.length) return out;
    try {
      const { data } = await sb.storage.from('images').createSignedUrls(paths.map((x) => x + '-t'), 3600);
      (data || []).forEach((d, i) => { if (d && d.signedUrl) out[paths[i]] = d.signedUrl; });
      const miss = paths.filter((x) => !out[x]);
      if (miss.length) {
        const r = await sb.storage.from('images').createSignedUrls(miss, 3600);
        (r.data || []).forEach((d, i) => { if (d && d.signedUrl) out[miss[i]] = d.signedUrl; });
      }
    } catch (e) { /* ohne Vorschau weiter */ }
    return out;
  }
  const thumbBox = (url) => {
    const im = el('div'); im.style.cssText = 'width:56px;height:56px;flex:none;border-radius:10px;background:var(--gray);overflow:hidden';
    if (url) { const i = el('img'); i.src = url; i.alt = ''; i.loading = 'lazy'; i.style.cssText = 'width:100%;height:100%;object-fit:cover'; im.append(i); }
    return im;
  };
  // Vorschaubilder zu Teilen und Outfits einer Person (Pfad: <Konto-ID>/items-<id> bzw. outfits-<id>); Schlüssel „items/<id>“ oder „outfits/<id>“
  async function contentThumbs(username, rows) {
    if (!rows.length) return {};
    try {
      const r = await sb.rpc('admin_member_id', { p_username: username });
      if (r.error || !r.data) return {};
      const paths = rows.map((x) => r.data + '/' + (x.kind === 'outfits' ? 'outfits-' : 'items-') + x.id);
      const m = await thumbMap(paths);
      const out = {};
      rows.forEach((x, i) => { if (m[paths[i]]) out[x.kind + '/' + x.id] = m[paths[i]]; });
      return out;
    } catch (e) { return {}; }
  }

        s2.append(d);
      }
      segmented(box, 'moderation', [['Gesperrte Konten', s1, banned.data.length], ['Versteckte Inhalte', s2, hidden.data.length]]);
    } catch (e) { console.error(e); failed(box, 'Das konnte nicht geladen werden. Ist Migration 0053 ausgeführt? (' + ((e && e.message) || '?') + ')', loadModeration); }
  }

  /* ---------- Rollen ---------- */
  const ROLE_NAMES = { admin: 'Admin', moderator: 'Helfer' };
  async function loadRoles() {
    await simpleLoad('roles', 'admin_roles_list', {}, (box, data) => {
      const s1 = section('Aktuelle Rollen', 'Admins sehen alles in dieser Verwaltung. Helfer melden sich hier ebenfalls an, sehen aber nur den Reiter „Staff Picks“.');
      for (const r of data) {
        const d = el('div', 'content-row');
        const sp = el('span'); sp.append(userBtn(r.username), ' · ' + (ROLE_NAMES[r.role] || r.role) + ' · seit ' + day(r.granted_at) + ' · ' + r.email); d.append(sp);
        if (!(r.role === 'admin' && r.me)) d.append(btn('Entziehen …', 'danger', async () => {
          const a = await confirmAction({ title: (ROLE_NAMES[r.role] || r.role) + '-Rolle von ' + r.username + ' entziehen?', intro: r.role === 'admin' ? r.username + ' kommt danach nicht mehr in die Verwaltung.' : r.username + ' verliert die Helfer-Rolle.', reasonLabel: 'Grund (im Protokoll, optional)', confirmLabel: 'Rolle entziehen', danger: true });
          if (a && !(await call('admin_set_role', { p_username: r.username, p_role: r.role, p_grant: false, p_reason: a.reason }, 'Rolle entzogen.')).failed) loadRoles();
        }));
        s1.append(d);
      }
      const s2 = section('Rolle vergeben');
      const form = el('form', 'search'); const input = el('input'); input.placeholder = 'Benutzername'; input.maxLength = 20; input.autocapitalize = 'none';
      const sel = el('select'); for (const [v, l] of [['moderator', 'Helfer'], ['admin', 'Admin']]) { const op = el('option', null, l); op.value = v; sel.append(op); }
      const go = el('button', 'primary', 'Vergeben …'); go.type = 'submit'; form.append(input, sel, go); s2.append(form);
      form.onsubmit = async (ev) => {
        ev.preventDefault(); const name = input.value.trim().toLowerCase(); if (!name) return;
        const adm = sel.value === 'admin';
        const a = await confirmAction({
          title: name + ' zum ' + (adm ? 'Admin' : 'Helfer') + ' machen?',
          intro: adm ? 'Ein Admin sieht alle Mitglieder samt E-Mail, kann Konten sperren und löschen und Rollen vergeben.' : 'Der Helfer kann sich in der Verwaltung anmelden und dort Staff Picks auswählen. Mehr sieht er nicht.',
          reasonLabel: 'Grund (im Protokoll, optional)', typeName: adm ? name : undefined, confirmLabel: 'Rolle vergeben', danger: adm,
        });
        if (a && !(await call('admin_set_role', { p_username: name, p_role: sel.value, p_grant: true, p_reason: a.reason }, 'Rolle vergeben.')).failed) { input.value = ''; loadRoles(); }
      };
      segmented(box, 'roles', [['Aktuelle Rollen', s1, data.length], ['Rolle vergeben', s2]]);
    }, loadRoles);
  }

  /* ---------- Staff Picks (Admins und Helfer) ---------- */
  const pickRow = (x, urls, actions) => {
    const d = el('div', 'content-row');
    const im = thumbBox(urls[x.path]);
    const sp = el('span'); sp.append(el('b', null, x.name || '(ohne Namen)'), el('br'));
    sp.append(el('span', 'muted small', [x.brand, x.size, 'von ' + x.username].filter(Boolean).join(' · ')));
    d.append(im, sp, ...actions);
    return d;
  };
  async function loadPicks() {
    await simpleLoad('picks', 'staff_pick_admin_list', {}, async (box, data) => {
      const urls = await thumbMap(data.map((x) => x.path));
      const s1 = section('Aktuelle Staff Picks (' + data.length + ')', 'Diese Teile stehen im Feed unter der Flamme. Entfernte, versteckte oder eingefrorene Teile erscheinen dort nicht.');
      if (!data.length) s1.append(el('p', 'muted', 'Noch keine Staff Picks.'));
      for (const x of data) {
        const acts = [];
        if (!x.live) acts.push(el('span', 'tag', 'nicht sichtbar'));
        acts.push(btn('Entfernen …', 'danger', async () => {
          const a = await confirmAction({ title: 'Aus den Staff Picks nehmen?', intro: '„' + (x.name || '?') + '“ von ' + x.username + ' verschwindet aus den Staff Picks. Das Teil selbst bleibt unverändert.', confirmLabel: 'Entfernen', danger: true });
          if (a && !(await call('staff_pick_set', { p_username: x.username, p_id: x.id, p_on: false }, 'Entfernt.')).failed) loadPicks();
        }));
        const r = pickRow(x, urls, acts);
        if (x.added_by) r.querySelector('span').append(el('br'), el('span', 'muted small', 'ausgewählt von ' + x.added_by + ' · ' + day(x.created_at)));
        s1.append(r);
      }
      const s2 = section('Teile suchen und auswählen', 'Sucht in allen öffentlichen Teilen (Name, Marke oder Benutzername). Ohne Suchwort kommen die neuesten.');
      const form = el('form', 'search'); const input = el('input'); input.type = 'search'; input.placeholder = 'z. B. Kapital, Nike oder ein Benutzername'; input.maxLength = 60; input.autocapitalize = 'none';
      const go = el('button', 'primary', 'Suchen'); go.type = 'submit'; form.append(input, go);
      const list = el('div'); s2.append(form, list);
      const run = async () => {
        loading(list);
        const { data: res, error } = await sb.rpc('staff_item_search', { p_query: input.value.trim() });
        list.replaceChildren();
        if (error) return list.append(el('p', 'err', 'Die Suche hat nicht geklappt: ' + error.message));
        if (!res.length) return list.append(el('p', 'muted', 'Nichts gefunden.'));
        const u = await thumbMap(res.map((x) => x.path));
        for (const x of res) {
          const b = x.picked ? el('span', 'tag', 'schon Pick') : btn('Auswählen', 'primary', async () => {
            b.disabled = true;
            if (!(await call('staff_pick_set', { p_username: x.username, p_id: x.id, p_on: true }, 'Zu den Staff Picks hinzugefügt.')).failed) loadPicks(); else b.disabled = false;
          });
          list.append(pickRow(x, u, [b]));
        }
      };
      form.onsubmit = (ev) => { ev.preventDefault(); run(); };
      segmented(box, 'picks', [['Aktuelle Picks', s1, data.length], ['Teile auswählen', s2]]);
      run();
    }, loadPicks);
  }

  /* ---------- Anmeldung ---------- */
  $('loginForm').onsubmit = async (ev) => {
    ev.preventDefault();
    $('loginErr').textContent = '';
    $('loginBtn').disabled = true;
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
      if (error) throw error;
      $('pass').value = '';
      await enter(data.user);
    } catch (e) { $('loginErr').textContent = 'Anmeldung fehlgeschlagen. E-Mail oder Passwort stimmt nicht.'; }
    $('loginBtn').disabled = false;
  };
  $('logout').onclick = async () => {
    leaving = true;
    try { await sb.auth.signOut(); show('login'); $('loginErr').textContent = ''; } finally { setTimeout(() => { leaving = false; }, 50); }
  };

  (async () => {
    let session = null;
    try { session = (await sb.auth.getSession()).data.session; } catch (e) { /* offline */ }
    if (session) enter(session.user); else show('login');
  })();
})();
</script>
</body>
</html>
